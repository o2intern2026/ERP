name: ci

on:
  pull_request:
  push:
    branches: [main, 'block/**', 'fix/**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      # Real environment variables win over .env (Dotenv is immutable), so .env.example placeholders are harmless.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_test
      DB_USERNAME: root
      DB_PASSWORD: root
      USE_FAKE_SERVICES: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Migrate and seed (MySQL 8, never SQLite)
        run: php artisan migrate:fresh --seed --force

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test
